<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yenlik Abdissattar</title>
<meta name="description" content="Yenlik Abdissattar, designer in Seoul: editorial design, film and the moving image.">
<link rel="preconnect" href="https://res.cloudinary.com">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300&family=Roboto:wght@900&display=swap">
<style>
/* One row of work moves sideways across an invisible 8-column grid.
   The piece nearest the middle of the screen grows; its project's name is set
   large along the bottom and its one line sits top left. */
:root {
  --paper: #ffffff;   /* ground */
  --ink: #293785;     /* names, the current project */
  --dusk: #496da2;    /* one-line descriptions, other projects */
  --mount: #e8edf0;   /* the ground prints sit on */

  --cond: "YA Light Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;   /* Helvetica Light Condensed */
  --black: "YA Black", "Roboto", "Arial Black", sans-serif;                        /* Helvetica Black */

  --vh: 100vh;
  --c: calc(100vw / 8);   /* one column */
  --g: 16px;              /* edge gutter */
  --base: 0.70;           /* where the row stands, as a share of the screen height */
}
@supports (height: 100dvh) { :root { --vh: 100dvh; } }

@font-face { font-family: "YA Light Condensed"; font-weight: 300; font-style: normal;
  src: local("Helvetica Neue LT Pro 47 Light Condensed"), local("HelveticaNeueLTPro-LtCn"),
       local("Helvetica Neue LT Std 47 Light Condensed"), local("HelveticaNeueLTStd-LtCn"),
       local("Helvetica Neue Light Condensed"), local("HelveticaNeue-LightCond"),
       local("Neue Helvetica 47 Light Condensed"), local("NeueHelvetica-47LightCondensed"); }
@font-face { font-family: "YA Black"; font-weight: 900; font-style: normal;
  src: local("Helvetica Black"), local("Helvetica-Black"),
       local("Helvetica Neue LT Pro 95 Black"), local("HelveticaNeueLTPro-Blk"),
       local("Helvetica Neue LT Std 95 Black"), local("HelveticaNeueLTStd-Blk"),
       local("Helvetica LT Std Black"), local("HelveticaLTStd-Blk"),
       local("Neue Helvetica 95 Black"), local("HelveticaNeue-Black"); }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--paper); color: var(--ink);
  font-family: var(--cond); font-weight: 300;
  -webkit-font-smoothing: antialiased;
  touch-action: pan-y;
}
p, h1, figure { margin: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

/* corners */
.top {
  position: fixed; z-index: 3; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: baseline; gap: var(--g);
  padding: var(--g) max(var(--g), env(safe-area-inset-right, 0px)) 0 max(var(--g), env(safe-area-inset-left, 0px));
  font-family: var(--black); font-weight: 900; font-size: 14px; line-height: 18px;
}
.top nav { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 20px; }
.top nav a { color: var(--dusk); }
.top nav a[aria-current="true"] { color: var(--ink); }
.top a:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }

/* top left: what the current piece is */
.meta {
  position: fixed; z-index: 2;
  left: calc(var(--c) + var(--g)); top: calc(var(--vh) * 0.08);
  width: calc(var(--c) * 3);
}
.kind { font-family: var(--black); font-weight: 900; font-size: 14px; line-height: 18px; }
.line { margin-top: 6px; font-size: 22px; line-height: 25px; color: var(--dusk); text-wrap: pretty; }

/* the row */
.stage { position: fixed; inset: 0; z-index: 1; overflow: hidden; cursor: grab; }
.stage.dragging { cursor: grabbing; }
.it {
  position: absolute; left: 0; top: 0;
  will-change: transform, width, height;
  cursor: pointer;
}
.it img, .it video { display: block; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; }
/* prints sit on a pale mount so white pages read against the white ground */
.it.m { background: var(--mount); display: flex; align-items: center; justify-content: center; }
.it.m img { width: 86%; height: 86%; object-fit: contain; }
.tag {
  position: absolute; left: 0; bottom: 100%; padding-bottom: 6px;
  font-family: var(--black); font-weight: 900; font-size: 12px; line-height: 14px; white-space: nowrap;
}

/* bottom: the project's name, large and thin */
.big {
  position: fixed; z-index: 0; left: max(var(--g), env(safe-area-inset-left, 0px)); bottom: calc(var(--vh) * 0.015);
  font-size: calc(var(--vh) * 0.2); line-height: .8; letter-spacing: -0.02em;
  white-space: nowrap; font-stretch: condensed;
}
.mail {
  position: fixed; z-index: 2; right: max(var(--g), env(safe-area-inset-right, 0px)); bottom: var(--g);
  font-family: var(--black); font-weight: 900; font-size: 14px; line-height: 18px; user-select: all;
}

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (max-width: 720px) {
  :root { --c: calc(100vw / 4); --base: 0.66; }
  .top { font-size: 12px; }
  .top nav { gap: 2px 12px; max-width: 60%; }
  .meta { left: max(var(--g), env(safe-area-inset-left, 0px)); top: calc(var(--vh) * 0.13); width: calc(100vw - 2 * var(--g)); }
  .line { font-size: 18px; line-height: 21px; max-width: 30ch; }
  .big { font-size: calc(var(--vh) * 0.11); }
  .mail { font-size: 12px; bottom: auto; top: calc(var(--vh) * 0.70 + 12px); }
}
</style>
</head>

<script>
(() => {
  const DATA = {"time": {"title": "TIME", "kind": "Editorial design, 2025", "line": "A reimagined architecture issue, built on a strict grid."}, "dust": {"title": "Dust", "kind": "Motion graphics, 2025", "line": "Grain, texture and surface, animated."}, "wander": {"title": "Wander", "kind": "Book design, 2026", "line": "A book built around stories by Jorge Luis Borges, shown spread by spread."}, "silence-of-the-dawn": {"title": "Silence of the Dawn", "kind": "Documentary, 2025", "line": "Singapore before sunrise, filmed in long, quiet takes."}, "calendar": {"title": "Calendar", "kind": "Visual systems, 2026", "line": "A year of street photographs, with the days set into each picture."}};
  const INTRO = { title: 'Yenlik Abdissattar', kind: 'Designer, Seoul',
                  line: 'Editorial design, film and the moving image. Scroll to move through the work.' };
  const stage = document.querySelector('.stage');
  const items = [...document.querySelectorAll('.it')];
  const big = document.querySelector('.big'), kind = document.querySelector('.kind'), line = document.querySelector('.line');
  const links = [...document.querySelectorAll('[data-go]')];
  const calm = matchMedia('(prefers-reduced-motion: reduce)');
  const ar = items.map((el) => +el.dataset.ar);

  let B, M, GAP, CX, BASE, x0 = [], w0 = [], end = 0, minPos = 0, maxPos = 0;
  let pos = 0, target = 0, current = null, raf = 0;

  function measure() {
    const W = innerWidth, H = innerHeight, phone = W <= 720;
    B = H * (phone ? 0.12 : 0.15);          // resting height of a piece
    M = H * (phone ? 0.38 : 0.47);          // height of the piece at the centre
    GAP = phone ? 8 : 12;
    CX = W * 0.5;
    BASE = H * parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--base'));
    let x = 0;
    x0 = []; w0 = [];
    ar.forEach((a, i) => { w0[i] = B * a; x0[i] = x; x += w0[i] + GAP; });
    end = x - GAP;
    minPos = -W * 0.32;                     // a little empty room before the first piece: the introduction
    maxPos = x0[x0.length - 1] + w0[w0.length - 1] / 2;
    target = Math.min(Math.max(target, minPos), maxPos);
  }

  const ease = (t) => t * t * (3 - 2 * t);
  // the name along the bottom shrinks only when it would not fit the screen
  function fitBig() {
    big.style.fontSize = '';
    const room = innerWidth - 32 - (innerWidth > 720 ? document.querySelector('.mail').offsetWidth + 24 : 0);
    if (big.scrollWidth > room) big.style.fontSize = (parseFloat(getComputedStyle(big).fontSize) * room / big.scrollWidth) + 'px';
  }
  function render() {
    const reach = B * 2.4;                  // how far the growth spreads to the neighbours
    const h = [], W = [];
    for (let i = 0; i < items.length; i++) {
      const d = Math.abs(x0[i] + w0[i] / 2 - pos);
      const f = Math.max(0, 1 - d / reach);
      h[i] = Math.min(B + (M - B) * ease(f), Math.max(B, innerWidth * 0.84 / ar[i]));
      W[i] = h[i] * ar[i];
    }
    // where `pos` falls in the resting row, mapped onto the grown row
    let X = 0, anchor = 0, k = 0;
    if (pos <= x0[0]) anchor = pos - x0[0];
    else {
      for (k = 0; k < items.length; k++) {
        const span = w0[k] + GAP;
        if (pos < x0[k] + span || k === items.length - 1) {
          const t = Math.min((pos - x0[k]) / span, 1);
          let Xk = 0; for (let j = 0; j < k; j++) Xk += W[j] + GAP;
          anchor = Xk + t * (W[k] + GAP);
          break;
        }
      }
    }
    const shift = CX - anchor;
    for (let i = 0; i < items.length; i++) {
      const s = items[i].style;
      s.width = W[i] + 'px'; s.height = h[i] + 'px';
      s.transform = `translate3d(${(X + shift).toFixed(1)}px, ${(BASE - h[i]).toFixed(1)}px, 0)`;
      X += W[i] + GAP;
    }
    // which project is at the centre
    let p = null;
    if (pos >= x0[0] - GAP) {
      let best = Infinity;
      for (let i = 0; i < items.length; i++) {
        const d = Math.abs(x0[i] + w0[i] / 2 - pos);
        if (d < best) { best = d; p = items[i].dataset.p; }
      }
    }
    if (p !== current) {
      current = p;
      const d = p ? DATA[p] : INTRO;
      big.textContent = d.title; kind.textContent = d.kind; line.textContent = d.line;
      fitBig();
      links.forEach((a) => a.setAttribute('aria-current', String(a.dataset.go === p)));
    }
  }

  function tick() {
    const k = calm.matches ? 1 : 0.12;
    pos += (target - pos) * k;
    if (Math.abs(target - pos) < 0.3) pos = target;
    render();
    raf = pos !== target ? requestAnimationFrame(tick) : 0;
  }
  const go = (t) => { target = Math.min(Math.max(t, minPos), maxPos); if (!raf) raf = requestAnimationFrame(tick); };
  const centreOf = (i) => x0[i] + w0[i] / 2;

  // wheel and trackpad
  addEventListener('wheel', (e) => {
    if (e.ctrlKey || document.querySelector('dialog[open]')) return;
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 32 : e.deltaMode === 2 ? innerWidth : 1;
    const d = (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * unit;
    go(target + d * 0.55);
  }, { passive: false });

  // drag and swipe
  let drag = null;
  stage.addEventListener('pointerdown', (e) => {
    drag = { x: e.clientX, t: target, moved: false, id: e.pointerId };
  });
  addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x;
    if (Math.abs(dx) > 4 && !drag.moved) { drag.moved = true; stage.classList.add('dragging'); stage.setPointerCapture?.(drag.id); }
    if (drag.moved) go(drag.t - dx * 0.6);
  });
  addEventListener('pointerup', (e) => {
    if (!drag) return;
    const moved = drag.moved; drag = null; stage.classList.remove('dragging');
    if (!moved) {
      const el = e.target.closest?.('.it');
      if (el) go(centreOf(items.indexOf(el)));
    }
  });

  // keys: one piece at a time
  const nearest = () => { let b = 0, bd = Infinity; items.forEach((_, i) => { const d = Math.abs(centreOf(i) - target); if (d < bd) { bd = d; b = i; } }); return b; };
  addEventListener('keydown', (e) => {
    if (['ArrowRight', 'ArrowDown', 'PageDown'].includes(e.key) || (e.key === ' ' && !e.shiftKey)) { e.preventDefault(); go(target < x0[0] ? centreOf(0) : centreOf(Math.min(nearest() + 1, items.length - 1))); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key) || (e.key === ' ' && e.shiftKey)) { e.preventDefault(); const i = nearest(); go(i === 0 ? minPos : centreOf(i - 1)); }
    else if (e.key === 'Home') { e.preventDefault(); go(minPos); }
    else if (e.key === 'End') { e.preventDefault(); go(maxPos); }
  });
  items.forEach((el, i) => el.addEventListener('focus', () => go(centreOf(i))));

  // project links
  links.forEach((a) => a.addEventListener('click', (e) => {
    e.preventDefault();
    const i = items.findIndex((el) => el.dataset.p === a.dataset.go);
    if (i >= 0) go(centreOf(i));
  }));
  document.querySelector('.me').addEventListener('click', (e) => { e.preventDefault(); go(minPos); });

  // films loop quietly while they can be seen
  const io = new IntersectionObserver((es) => es.forEach(({ target: v, isIntersecting: on }) => {
    if (on && !calm.matches) v.play().catch(() => {}); else v.pause();
  }), { threshold: 0.2 });
  document.querySelectorAll('video').forEach((v) => io.observe(v));

  addEventListener('resize', () => { fitBig(); const i = target < x0[0] ? -1 : nearest(); measure(); if (i >= 0) { target = centreOf(i); } pos = target; render(); });
  measure();
  const start = location.hash && items.findIndex((el) => el.id === location.hash.slice(1));
  pos = target = start > 0 ? centreOf(start) : minPos;
  render();
  fitBig();
  document.fonts?.ready.then(fitBig);
})();
</script>
</body>
</html>
